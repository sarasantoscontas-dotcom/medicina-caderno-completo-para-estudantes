<script id="student-promo-mount">(()=>{const markup="<div class=\"flash-sale-math\" id=\"student-flash-sale\" aria-label=\"Promoção relâmpago\"><span class=\"sale-label\">Promoção relâmpago · por tempo limitado</span><div class=\"sale-price\"><del>De R$ 29,89</del><strong>Por R$ 9,99</strong></div><p>Caderno completo para estudantes de Medicina, com resumos prontos, flashcards e organização acadêmica.</p><a class=\"student-sale-button\" href=\"https://pay.cakto.com.br/a5q8fbq\" target=\"_blank\" rel=\"noopener noreferrer\">Adquirir por R$ 9,99</a><small>Pagamento único · sem mensalidade</small></div>";function mount(){if(document.getElementById('student-flash-sale'))return true;const h=document.querySelector('main h1,h1');if(!h)return false;const intro=h.parentElement.querySelector('p');(intro||h).insertAdjacentHTML('afterend',markup);return true;}if(!mount()){const observer=new MutationObserver(()=>{if(mount())observer.disconnect();});observer.observe(document.getElementById('root')||document.body,{childList:true,subtree:true});}})();</script></body>
