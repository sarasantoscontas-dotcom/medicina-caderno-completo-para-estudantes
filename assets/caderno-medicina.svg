<svg xmlns="http://www.w3.org/2000/svg" width="620" height="480" viewBox="0 0 620 480" role="img" aria-labelledby="title desc"><title id="title">Caderno espiral de Medicina</title><desc id="desc">Resumo de semiologia e raciocínio clínico com história, exame e interpretação.</desc><defs><linearGradient id="cover" x2="1" y2="1"><stop stop-color="#bca4d7" /><stop offset="1" stop-color="#dfb6c8" /></linearGradient><linearGradient id="metal" x2="1" y2="1"><stop stop-color="#e8e6ef" /><stop offset=".45" stop-color="#827c91" /><stop offset=".7" stop-color="#f4eff9" /><stop offset="1" stop-color="#777382" /></linearGradient><filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="7" dy="12" stdDeviation="9" flood-color="#69516e" flood-opacity=".22" /></filter><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".62" numOctaves="3" stitchTiles="stitch" /><feColorMatrix type="saturate" values="0" /><feComponentTransfer><feFuncA type="linear" slope=".055" /></feComponentTransfer></filter></defs><ellipse cx="325" cy="453" rx="240" ry="14" fill="#71517c" opacity=".09" /><g transform="rotate(-3 310 240)" filter="url(#shadow)"><rect x="77" y="40" width="493" height="414" rx="21" fill="url(#cover)" /><rect x="94" y="47" width="466" height="398" rx="13" fill="#e4dce6" /><path d="M103 54H548V437H103Z" fill="#faf6e9" /><path d="M110 56H550V429H110Z" fill="#fffcf0" /><rect x="112" y="57" width="438" height="371" filter="url(#grain)" opacity=".7" /><g fill="none" stroke="#c8c2da" stroke-width=".8" opacity=".45"><path d="M112 123H537" /><path d="M112 148H537" /><path d="M112 173H537" /><path d="M112 198H537" /><path d="M112 223H537" /><path d="M112 248H537" /><path d="M112 273H537" /><path d="M112 298H537" /><path d="M112 323H537" /><path d="M112 348H537" /><path d="M112 373H537" /><path d="M112 398H537" /><path d="M112 423H537" /></g><path d="M136 63V427" stroke="#dc9ca9" opacity=".65" /><path d="M550 132h24v75h-24" fill="#a9d8c3" /><path d="M550 217h22v67h-22" fill="#efd57e" /><path d="M550 294h25v61h-25" fill="#c8b2e7" /><rect x="186" y="26" width="116" height="28" fill="#eadab8" opacity=".8" transform="rotate(-5 244 40)" /><g font-family="Georgia,serif" fill="#573e68"><text x="157" y="87" font-size="10" letter-spacing="1.5" font-family="Arial,sans-serif" font-weight="700">MEDICINA · RESUMO</text><text x="157" y="119" font-size="27" font-style="italic" font-weight="700">Semiologia e raciocínio</text><text x="157" y="145" font-size="18" font-style="italic">História, exame e hipóteses</text></g><path d="M155 167H515" stroke="#f6d86a" stroke-width="17" opacity=".65" /><text x="158" y="172" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#526356">O dado precisa de contexto.</text><g font-family="Arial,sans-serif" fill="#4b5368" font-size="12"><text x="158" y="197">Cronologia e sinais orientam a investigação.</text><text x="158" y="216">O teste atualiza a hipótese clínica.</text></g><g font-family="Arial,sans-serif" font-size="11"><rect x="155" y="235" width="115" height="72" rx="12" fill="#d5eadd" /><text x="168" y="256" fill="#2d735d" font-weight="700">HISTÓRIA</text><text x="168" y="276" fill="#4b5368">Cronologia.</text><text x="168" y="292" fill="#4b5368">Contexto.</text><rect x="281" y="235" width="111" height="72" rx="12" fill="#e6d8f3" /><text x="294" y="256" fill="#795080" font-weight="700">EXAME</text><text x="294" y="276" fill="#4b5368">Achados.</text><text x="294" y="292" fill="#4b5368">Síndromes.</text><rect x="403" y="235" width="111" height="72" rx="12" fill="#f7d6df" /><text x="416" y="256" fill="#a3557d" font-weight="700">HIPÓTESES</text><text x="416" y="276" fill="#4b5368">Comparação.</text><text x="416" y="292" fill="#4b5368">Reavaliação.</text></g><text x="158" y="334" font-family="Georgia,serif" font-size="20" font-style="italic" font-weight="700" fill="#6e4b7b">Da queixa à interpretação</text><g font-family="Arial,sans-serif" fill="#4b5368" font-size="12"><circle cx="